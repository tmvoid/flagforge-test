# Lives at the REPO ROOT (flagforge-test/.github/workflows/). The launcher is a subfolder, so every step
# runs inside silentproxy-launcher/.
#
# Publish a release:
#   git tag launcher-v0.1.0 && git push origin launcher-v0.1.0
#
# The push trigger is the normal path. workflow_dispatch exists as a fallback and for re-cutting
# a release; it needs the tag to already exist on the remote, so push the tag first.
name: launcher-release
on:
  push:
    tags: ["launcher-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. launcher-v0.1.0 (must already be pushed)"
        required: true

# Only the publish job needs write access; everything else runs read-only.
permissions:
  contents: read

# Two runs must never write the same release concurrently.
concurrency:
  group: launcher-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: silentproxy-launcher
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s tests -t .

  build:
    needs: test
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # bin  = the name given to PyInstaller (it adds .exe by itself on Windows)
          # file = the name that comes out, and the name players download
          - { os: ubuntu-latest,  bin: silentproxy-linux,   file: silentproxy-linux }
          - { os: macos-latest,   bin: silentproxy-macos,   file: silentproxy-macos }
          - { os: windows-latest, bin: silentproxy-windows, file: silentproxy-windows.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: silentproxy-launcher
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      # Pinned so two releases of the same source produce the same binaries.
      - run: python -m pip install "pip==24.3.1" "pyinstaller==6.22.3"
      - run: python -m PyInstaller --onefile --clean --noconfirm --name ${{ matrix.bin }} --paths . --collect-submodules silentproxy packaging/entry.py
      - name: Smoke test (the file exists under the expected name and starts)
        run: dist/${{ matrix.file }} --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.file }}
          path: silentproxy-launcher/dist/${{ matrix.file }}
          if-no-files-found: error

  publish:
    needs: build
    # Only a launcher-v tag is ever published. A dispatch must name one explicitly.
    if: startsWith(github.ref, 'refs/tags/launcher-v') || (inputs.tag != '' && startsWith(inputs.tag, 'launcher-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Check out the tag we are about to publish, not the ref the run was dispatched on.
      # fetch-depth 0 so the tag itself is available to resolve below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate the release tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^launcher-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must look like launcher-vX.Y.Z, got '$TAG'"
            exit 1
          fi
          # Resolve the tag to the commit it points at. For an annotated tag this differs from
          # GITHUB_SHA, which is why we resolve it here and publish that commit.
          COMMIT="$(git rev-parse "refs/tags/$TAG^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "$COMMIT" != "$HEAD_SHA" ]]; then
            echo "::error::tag $TAG points at $COMMIT but the checkout is $HEAD_SHA"
            exit 1
          fi
          echo "Publishing $TAG ($COMMIT)"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Include the browser extension
        run: |
          XPI="${{ github.workspace }}/docs/downloads/silentproxy-firefox.xpi"
          if [[ ! -f "$XPI" ]]; then
            echo "::error::silentproxy-firefox.xpi is missing from this ref — build the extension and commit it first"
            exit 1
          fi
          cp "$XPI" dist/silentproxy-firefox.xpi

      # Exclude the manifest itself, otherwise it would list its own checksum.
      - name: Checksums
        run: cd dist && sha256sum $(ls | grep -v '^SHA256SUMS\.txt$') > SHA256SUMS.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ steps.tag.outputs.commit }}
          files: dist/*
